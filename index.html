<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Convite Açaí</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Floating açaí background -->
  <div class="acai-container" id="acai"></div>

  <!-- Step 1: Invitation -->
  <div class="step active" id="s1">
    <h1>🍇 Psst… tenho uma ideia!</h1>
    <p>
      Sabe aquele vontade de tomar um açaí gelado à tarde?<br>
      Que tal a gente se encontrar no fim de semana? 🌞
    </p>
    <button class="btn" onclick="go(2)">Continuar →</button>
  </div>

  <!-- Step 2: Confirmation -->
  <div class="step" id="s2">
    <h1>💜 Topa vir comigo?</h1>
    <p>Escolha sua resposta abaixo:</p>
    <div class="options">
      <div class="option">
        <input type="checkbox" id="yes" aria-label="Sim">
        <label for="yes">Sim! 😋</label>
      </div>
      <div class="option" id="no-wrap">
        <input type="checkbox" id="no" aria-label="Não" tabindex="-1">
        <label for="no" id="no-label">Não 😕</label>
      </div>
    </div>
  </div>

  <!-- Step 3: Scheduling Form -->
  <div class="step" id="s3">
    <h1>🎉 Eba! Vamos agendar?</h1>
    <form id="fm">
      <div class="form-group">
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" required autocomplete="name">
      </div>
      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" required autocomplete="email">
      </div>
      <div class="form-group">
        <label for="data">Data</label>
        <input type="date" id="data" name="data" required>
      </div>
      <div class="form-group">
        <label for="hora">Hora</label>
        <input type="time" id="hora" name="hora" required>
      </div>
      <div class="form-group">
        <label for="local">Local favorito</label>
        <input type="text" id="local" name="local" placeholder="Qual açaíteria você prefere?">
      </div>
      <div class="form-group">
        <label for="obs">Sabor preferido</label>
        <textarea id="obs" name="observacoes" placeholder="Natural, com granola, frutas..."></textarea>
      </div>
      <button type="submit" class="btn" style="width: 100%">Confirmar Açaí 🍇</button>
    </form>
    <div class="success" id="ok" style="display: none" role="status" aria-live="polite">
      ✅ Encontro de açaí confirmado!<br>
      Tá marcado para tomar um açaí gelado! 🍇💜
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
